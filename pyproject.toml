[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dentinel"
version = "0.1.0"
description = "Daemonless amd64 Sentinel extraction and OCI image repacking"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/killerprojecte/Dentinel"
Issues = "https://github.com/killerprojecte/Dentinel/issues"

[project.scripts]
dentinel = "dentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
