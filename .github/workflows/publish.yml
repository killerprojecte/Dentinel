name: Build and publish Dentinel

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source:
        description: Source image reference (tag or digest)
        required: true
        type: string
        default: ghcr.io/altcha-org/sentinel:latest
      patch_mode:
        description: Verified patch mode for the rebuilt image
        required: true
        type: choice
        options:
          - identity
          - enterprise-state
        default: enterprise-state
      publish:
        description: Publish the rebuilt image to GHCR
        required: true
        type: boolean
        default: false
      tag:
        description: Optional output tag; omit for a unique tag (latest is reserved)
        required: false
        type: string
        default: ''
      update_latest:
        description: Also publish latest (only when publish is enabled)
        required: true
        type: boolean
        default: false

permissions: {}

# Serialize publishing so older master runs cannot overwrite a newer latest.
concurrency:
  group: dentinel-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      SOURCE: ${{ inputs.source || 'ghcr.io/altcha-org/sentinel:latest' }}
      PATCH_MODE: ${{ inputs.patch_mode || 'enterprise-state' }}
      REQUESTED_TAG: ${{ inputs.tag }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      REVISION: ${{ github.sha }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    outputs:
      target: ${{ steps.metadata.outputs.target }}
      latest_target: ${{ steps.metadata.outputs.latest_target }}
      image_digest: ${{ steps.metadata.outputs.image_digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate dispatch inputs
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re

          source = os.environ['SOURCE']
          tag = os.environ['REQUESTED_TAG']
          if os.environ['PATCH_MODE'] not in ('identity', 'enterprise-state'):
              raise SystemExit('Invalid patch mode')
          if not source or any(character.isspace() for character in source):
              raise SystemExit('Source must be a non-empty image reference without whitespace')
          if tag and re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}', tag) is None:
              raise SystemExit('Tag must match [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}')
          if tag == 'latest':
              raise SystemExit('The latest tag is reserved; use update_latest instead')
          if re.fullmatch(r'(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})', os.environ['REVISION']) is None:
              raise SystemExit('Revision must be a full commit SHA')
          if re.fullmatch(r'[a-z0-9][a-z0-9-]*', os.environ['REPOSITORY_OWNER'].lower()) is None:
              raise SystemExit('Invalid repository owner')
          for key in ('RUN_ID', 'RUN_ATTEMPT'):
              if re.fullmatch(r'[0-9]+', os.environ[key]) is None:
                  raise SystemExit('Invalid workflow run identifier')
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI help
        run: |
          python -m dentinel --help
          python -m dentinel run --help
          python -m dentinel publish --help
      - name: Extract, patch and repack without a daemon
        shell: bash
        run: |
          python -m dentinel run \
            --source "$SOURCE" \
            --patch-mode "$PATCH_MODE" \
            --work work \
            --source-url "$SOURCE_URL" \
            --revision "$REVISION"
      - name: Prepare validated image metadata
        id: metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          report = json.loads(Path('work/repack-report.json').read_text(encoding='utf-8'))
          if report.get('mode') != os.environ['PATCH_MODE']:
              raise SystemExit('Repack report mode differs from requested patch mode')
          for key in ('source_digest', 'image_digest'):
              if not isinstance(report.get(key), str) or re.fullmatch(r'sha256:[0-9a-f]{64}', report[key]) is None:
                  raise SystemExit(f'Invalid {key} in repack report')
          source_short = report['source_digest'].split(':', 1)[1][:12]
          revision_short = os.environ['REVISION'][:12].lower()
          unique_tag = f"s{source_short}-r{revision_short}-{os.environ['RUN_ID']}-{os.environ['RUN_ATTEMPT']}"
          tag = os.environ['REQUESTED_TAG'] or unique_tag
          if re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}', tag) is None or tag == 'latest':
              raise SystemExit('Invalid or reserved output tag')
          package = f"ghcr.io/{os.environ['REPOSITORY_OWNER'].lower()}/dentinel"
          target = f'{package}:{tag}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'target={target}\n')
              output.write(f'latest_target={package}:latest\n')
              output.write(f"image_digest={report['image_digest']}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Dentinel 构建\n\n')
              summary.write(f"- 补丁模式：`{report['mode']}`\n")
              summary.write(f"- 上游摘要：`{report['source_digest']}`\n")
              summary.write(f"- 构建镜像摘要：`{report['image_digest']}`\n")
              summary.write(f'- 目标：`{target}`\n')
              summary.write('- OCI 归档和原始分析包仅保存为工作流 artifact；是否发布由独立任务控制。\n')
          PY
      - name: Upload original analysis archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dentinel-analysis
          path: work/analysis.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload rebuilt OCI archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dentinel-oci
          path: work/dentinel.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dentinel-reports
          path: |
            work/*.json
            work/patched/patch-report.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.publish) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PYTHONPATH: src
      TARGET: ${{ needs.build.outputs.target }}
      LATEST_TARGET: ${{ needs.build.outputs.latest_target }}
      EXPECTED_DIGEST: ${{ needs.build.outputs.image_digest }}
    steps:
      - name: Check out CLI source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Download rebuilt OCI archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dentinel-oci
          path: work
      - name: Publish validated tag without a daemon
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, '-m', 'dentinel', 'publish', '--archive', 'work/dentinel.oci.tar',
               '--target', os.environ['TARGET'], '--cache', '.tools'],
              check=True, stdout=subprocess.PIPE, text=True,
          )
          digest = result.stdout.strip()
          if re.fullmatch(r'sha256:[0-9a-f]{64}', digest) is None:
              raise SystemExit('Publish did not return a valid image digest')
          if digest != os.environ['EXPECTED_DIGEST']:
              raise SystemExit('Published digest does not match the rebuilt image')
          print(digest)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Dentinel 发布\n\n')
              summary.write(f"- 镜像：`{os.environ['TARGET']}`\n")
              summary.write(f'- CLI 实际返回摘要：`{digest}`\n')
          PY
      - name: Update latest on master without a daemon
        if: ${{ github.event_name == 'push' || (inputs.update_latest && inputs.publish) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          head = subprocess.run(
              ['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/master", '--jq', '.object.sha'],
              check=True, stdout=subprocess.PIPE, text=True,
          ).stdout.strip()
          if head != os.environ['GITHUB_SHA']:
              print('Skip latest: this commit is no longer the master HEAD.')
              raise SystemExit(0)
          result = subprocess.run(
              [sys.executable, '-m', 'dentinel', 'publish', '--archive', 'work/dentinel.oci.tar',
               '--target', os.environ['LATEST_TARGET'], '--cache', '.tools'],
              check=True, stdout=subprocess.PIPE, text=True,
          )
          digest = result.stdout.strip()
          if re.fullmatch(r'sha256:[0-9a-f]{64}', digest) is None:
              raise SystemExit('Publish did not return a valid image digest')
          if digest != os.environ['EXPECTED_DIGEST']:
              raise SystemExit('Published latest digest does not match the rebuilt image')
          print(digest)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"- 显式更新：`{os.environ['LATEST_TARGET']}`\n")
              summary.write(f'- CLI 实际返回摘要：`{digest}`\n')
          PY
